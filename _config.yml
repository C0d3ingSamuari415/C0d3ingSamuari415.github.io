title: "Curtis | Cybersecurity Portfolio"
description: "SOC Labs, Automation, Packet Analysis, Cloud Security, and ServiceNow ITSM Projects"
theme: jekyll-theme-cayman

# Navigation Menu
# Note: Cayman's default layout does not render this automatically.
# It's kept here, accurate and ready, for when a custom _layouts/default.html is added.
